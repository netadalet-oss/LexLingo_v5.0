name: Verify LexLingo APK-synchronized Android build

on:
  push:
    branches:
      - apk-asset-sync-helper-2026-10-26
    paths:
      - APK_SYNC_PROGRESS.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout synchronized sources
        uses: actions/checkout@v4
      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Android APK from GitHub code
        run: gradle --no-daemon assembleDebug
      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: LexLingo-synchronized-debug-APK
          path: app/build/outputs/apk/debug/*.apk
