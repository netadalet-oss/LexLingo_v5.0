name: Import verified LexLingo APK payload

on:
  push:
    branches:
      - apk-asset-sync-helper-2026-10-26
    paths:
      - apk_payload/READY

permissions:
  contents: write

concurrency:
  group: lexlingo-import-assets
  cancel-in-progress: false

jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout payload branch
        uses: actions/checkout@v4

      - name: Reconstruct and authenticate supplied APK
        shell: bash
        run: |
          set -euo pipefail
          test -f apk_payload/READY
          test -d apk_payload/parts
          find apk_payload/parts -type f -name 'part_*.b64' -print | LC_ALL=C sort | while IFS= read -r chunk; do cat "$chunk"; done | base64 --decode > "$RUNNER_TEMP/base.apk"
          echo "455c3671e3eb521e8dfdaf3b35fdd6178d7961163d5ecd16870fb5f504390767  $RUNNER_TEMP/base.apk" | sha256sum --check

      - name: Copy APK source assets byte for byte
        shell: bash
        run: |
          python3 tools/sync_assets_from_apk.py "$RUNNER_TEMP/base.apk" --repo . --apply --prune

      - name: Verify all 632 source files against APK
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, zipfile
          root = pathlib.Path("app/src/main/assets")
          apk = pathlib.Path(os.environ["RUNNER_TEMP"])/"base.apk"
          expected = {}
          with zipfile.ZipFile(apk) as z:
              for i in z.infolist():
                  if i.is_dir() or not i.filename.startswith("assets/"):
                      continue
                  name=i.filename[7:]
                  if name.startswith("/") or ".." in pathlib.PurePosixPath(name).parts:
                      raise SystemExit(f"Unsafe name {name}")
                  expected[name] = hashlib.sha256(z.read(i)).digest()
          actual={p.relative_to(root).as_posix() for p in root.rglob("*") if p.is_file()}
          if set(expected)!=actual:
              raise SystemExit(f"Asset file set mismatch: {len(expected)} expected, {len(actual)} actual")
          for name,digest in expected.items():
              if hashlib.sha256((root/name).read_bytes()).digest()!=digest:
                  raise SystemExit(f"Byte mismatch: {name}")
          print(f"PASS: all {len(expected)} assets match exactly")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build and validate Android application
        run: gradle --no-daemon assembleDebug

      - name: Commit assets and remove upload payload
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf apk_payload
          git add -A app/src/main/assets
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Synchronize all 632 LexLingo assets from SHA-verified APK"
          git push origin "HEAD:$GITHUB_REF_NAME"
