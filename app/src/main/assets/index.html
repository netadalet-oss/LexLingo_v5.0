<script id="lexFunctionalSettings20261026">
/* LexLingo Gold – strictly functional, opt-in settings. No visual preferences. */
(function(){
  'use strict';
  if(window.__lexFunctionalSettingsV2)return;
  window.__lexFunctionalSettingsV2=true;
  var D=document,W=window, PREFIX='lex_v3_', OWN=PREFIX+'functionalSettingsV2';
  var defaults={quizStart:'default',speechRate:'1',speechPitch:'1',haptics:'off'};
  var allowed={quizStart:['default','0','1','2','3','4','5','6','7','8'],speechRate:['0.75','0.9','1','1.1','1.25','1.5'],speechPitch:['0.8','1','1.2'],haptics:['off','on']};
  function jparse(value,fallback){try{var x=JSON.parse(value);return x==null?fallback:x}catch(e){return fallback}}
  function readOwn(){var x=jparse(safeGet(OWN),{}),r={};Object.keys(defaults).forEach(function(k){r[k]=allowed[k].indexOf(String(x[k]))>=0?String(x[k]):defaults[k]});return r}
  function safeGet(key){try{return localStorage.getItem(key)}catch(e){return null}}
  function safeSet(key,val){try{localStorage.setItem(key,String(val));return true}catch(e){return false}}
  function safeRemove(key){try{localStorage.removeItem(key);return true}catch(e){return false}}
  var pref=readOwn();
  function saveOwn(){safeSet(OWN,JSON.stringify(pref))}
  function htmlEsc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function announce(t){try{if(typeof W.gold==='function'){W.gold(t);return}if(typeof W.msg==='function'){W.msg(t);return}}catch(e){}var e=D.getElementById('toast');if(e){e.textContent=t;}}
  function prefsField(name,desc,id,options,value){return '<label class="lexFuncField"><span><b>'+htmlEsc(name)+'</b><small>'+htmlEsc(desc)+'</small></span><select data-lexfunc="'+id+'" aria-label="'+htmlEsc(name)+'">'+options.map(function(o){return '<option value="'+htmlEsc(o[0])+'"'+(String(value)===String(o[0])?' selected':'')+'>'+htmlEsc(o[1])+'</option>'}).join('')+'</select></label>'}
  function note(msg){return '<p class="lexFuncNote">'+htmlEsc(msg)+'</p>'}
  function controlButton(label,handler){return '<button class="ghost lexFuncAction" type="button" data-lexfunc-action="'+htmlEsc(handler)+'">'+htmlEsc(label)+'</button>'}
  function panel(title,desc,icon,body){var el=D.createElement('details');el.className='lexFuncAccordion';el.innerHTML='<summary><span class="lexFuncIcon" aria-hidden="true">'+icon+'</span><span class="lexFuncHeading"><b>'+htmlEsc(title)+'</b><small>'+htmlEsc(desc)+'</small></span><span class="lexFuncArrow" aria-hidden="true">⌄</span></summary><div class="lexFuncPanel">'+(body||'')+'</div>';return el}
  function newsFeeds(){var f=jparse(safeGet(PREFIX+'newsFeedConfig'),{tr:true,nl:true,world:true});return f&&typeof f==='object'&&!Array.isArray(f)?{tr:f.tr!==false,nl:f.nl!==false,world:f.world!==false}:{tr:true,nl:true,world:true}}
  function newsInterval(){var s=safeGet(PREFIX+'newsMin');return ['5','10','15','30','60','120'].indexOf(s)>=0?s:'default'}
  function sourceToggle(id,title,desc,enabled){return prefsField(title,desc,'feed-'+id,[['on','Açık'],['off','Kapalı']],enabled?'on':'off')}
  function createFunctionalPanels(){var list=[],f=newsFeeds();
    list.push(panel('Çalışma ve quiz tercihleri','Soru biçimi ve aktif çalışma seçimi','?',
      prefsField('Quiz açılış bölümü','Havuz quizi açıldığında doğrudan gidilecek ölçüm','quizStart',[['default','Baştan başla'],['0','Anlam ve karşılık'],['1','Dinleme'],['2','Yazma'],['3','Dikte'],['4','Boşluk doldurma'],['5','Çoklu okuma ve çeviri'],['6','Cümle kurma'],['7','Gramer muhakemesi'],['8','Telaffuz']],pref.quizStart)+
      '<div class="lexFuncActions">'+controlButton('Kategori seç','category')+controlButton('Dil yönünü seç','direction')+'</div>'+
      note('Bu seçenek yalnızca havuz quizi açılışında ilgili bölüme ilerler; puanlama ve soru içerikleri aynı kalır.')));
    list.push(panel('Seslendirme tercihleri','Konuşma sentezi ve cihaz geri bildirimi','♫',
      prefsField('Seslendirme hızı','Yalnızca cihazın metin okuma motoruna uygulanır','speechRate',[['0.75','Yavaş · 0,75×'],['0.9','Hafif yavaş · 0,9×'],['1','Uygulama varsayılanı'],['1.1','Hafif hızlı · 1,1×'],['1.25','Hızlı · 1,25×'],['1.5','Çok hızlı · 1,5×']],pref.speechRate)+
      prefsField('Konuşma tonu','Yalnızca sentezlenmiş sese uygulanır','speechPitch',[['0.8','Daha kalın'],['1','Uygulama varsayılanı'],['1.2','Daha ince']],pref.speechPitch)+
      prefsField('Dokunsal geri bildirim','Destekleyen cihazlarda buton dokunuşu titreşimi','haptics',[['off','Kapalı'],['on','Açık']],pref.haptics)+
      note('Önceden kaydedilmiş ses dosyaları değiştirilmez. Titreşim cihaz ve Android WebView desteğine bağlıdır.')));
    list.push(panel('Haber akışı ve kaynaklar','İçerik kaynakları ve yenileme sıklığı','◉',
      sourceToggle('tr','Türkiye haberleri','Türkçe kaynakları kullan',f.tr)+
      sourceToggle('nl','Hollanda haberleri','Hollandaca kaynakları kullan',f.nl)+
      sourceToggle('world','Dünya haberleri','Uluslararası kaynakları kullan',f.world)+
      prefsField('Haber yenileme aralığı','Mevcut haber sistemi bu süreyi kullanır','newsMin',[['default','Uygulama varsayılanı'],['5','5 dakika'],['10','10 dakika'],['15','15 dakika'],['30','30 dakika'],['60','60 dakika'],['120','120 dakika']],newsInterval())+
      '<div class="lexFuncActions">'+controlButton('Haberleri yenile','refreshNews')+controlButton('Kayan haber ayarları','ticker')+'</div>'+
      note('Kaynak seçimi ve yenileme aralığı kaydedilir. Zamanlayıcıdaki yeni aralık uygulama tekrar açıldığında kesin olarak devreye girer.')));
    list.push(panel('Veri ve güvenlik işlemleri','Mevcut yedekleme ve hesap araçları','⚿',
      '<div class="lexFuncActions">'+controlButton('Yedekle / geri yükle','backup')+controlButton('Hesap ve profil','profile')+'</div>'+
      note('Buradaki kısayollar uygulamanın mevcut veri araçlarını açar. Otomatik silme veya yeni bulut aktarımı eklenmez.')));
    return list;
  }
  function existingPanel(section){
    if(section.matches('details,summary')||section.classList.contains('lexFuncIntro'))return null;
    if(section.closest('.lexFuncAccordion'))return null;
    var heading=section.querySelector('h3,h4,.lexV125BlurSetting b'),title=heading?heading.textContent.trim():'Mevcut ayar ve araçlar';
    var p=section.querySelector('p'),desc=p?p.textContent.trim().slice(0,95):'Uygulamanın mevcut işlevleri';
    if(section.id==='v8BackupPanel')title='Yedekleme ve geri yükleme';
    if(section.id==='lexV118Maintenance')title='Bakım ve güncelleme';
    if(section.id==='lexV125BlurSetting')title='Kart çeviri davranışı';
    var wrap=panel(title,desc,'⌁','');wrap.classList.add('lexFuncExisting');
    wrap.querySelector('.lexFuncPanel').appendChild(section);
    return wrap;
  }
  var lastQuizRoot=null;
  function quizJump(){
    var root=D.querySelector('#view #lexPoolQuizRoot');
    if(!root){lastQuizRoot=null;return;}
    if(lastQuizRoot===root)return;
    lastQuizRoot=root;
    if(pref.quizStart==='default')return;
    var target=pref.quizStart;
    setTimeout(function(){
      if(!D.documentElement.contains(root))return;
      var step=root.querySelector('#lexSkill_'+target);
      if(step&&typeof step.scrollIntoView==='function')try{step.scrollIntoView({block:'start',behavior:'auto'})}catch(e){}
    },180);
  }
  var changing=false;
  function enhance(){
    quizJump();
    if(changing)return;
    var view=D.getElementById('view');if(!view)return;
    var grid=view.querySelector('.manageGrid');
    if(!grid)return;
    changing=true;
    try{
      grid.classList.add('lexFuncGrid');
      if(!grid.querySelector(':scope > .lexFuncIntro')){
        var head=D.createElement('div');head.className='lexFuncIntro';head.innerHTML='<strong>İşlevsel ayarlar</strong><span>Başlıklar başlangıçta kapalıdır. Açmak için sağdaki oka dokunun.</span>';
        grid.insertBefore(head,grid.firstChild);
        createFunctionalPanels().forEach(function(p){grid.appendChild(p)});
        // Put added functional groups above the unchanged application tools.
        var first=grid.querySelector(':scope > .lexFuncAccordion');if(first){grid.insertBefore(first,head.nextSibling);var after=first;var panels=Array.from(grid.children).filter(function(n){return n.classList.contains('lexFuncAccordion')&&!n.classList.contains('lexFuncExisting')});panels.forEach(function(n){if(n!==first){grid.insertBefore(n,after.nextSibling);after=n}})}
      }
      Array.from(grid.children).forEach(function(n){
        if(n.nodeType!==1||n.matches('.lexFuncIntro,.lexFuncAccordion'))return;
        var wrap=existingPanel(n);if(wrap)grid.insertBefore(wrap,n.nextSibling);
      });
      // Additional existing sections may be added outside the original grid.
      Array.from(view.querySelectorAll('#v8BackupPanel,#lexV118Maintenance,#lexV125BlurSetting')).forEach(function(n){
        if(n.closest('.lexFuncAccordion'))return;
        var wrap=existingPanel(n);if(wrap)grid.appendChild(wrap);
      });
    }finally{changing=false}
  }
  var scheduled=false;
  function schedule(){if(scheduled)return;scheduled=true;setTimeout(function(){scheduled=false;enhance()},65)}
  function invoke(name){try{var fn=W[name];if(typeof fn==='function'){fn();return true}}catch(e){}return false}
  function trigger(action){
    if(action==='category'){try{if(typeof W.openPicker==='function')W.openPicker('cat')}catch(e){announce('Kategori seçimi açılamadı.')};return}
    if(action==='direction'){try{if(typeof W.openPicker==='function')W.openPicker('dir')}catch(e){announce('Dil seçimi açılamadı.')};return}
    if(action==='profile'){if(!invoke('openProfile'))announce('Profil aracı kullanılamıyor.');return}
    if(action==='backup'){if(!invoke('openCloudManager'))announce('Yedekleme aracı kullanılamıyor.');return}
    if(action==='ticker'){if(!invoke('openTickerManager'))announce('Haber ayarları açılamadı.');return}
    if(action==='refreshNews'){
      var fn=W.fetchNewsItems||W.fetchNewsItemsV2;
      if(typeof fn==='function'){
        try{Promise.resolve(fn(true)).then(function(){if(typeof W.updateTicker==='function')W.updateTicker();announce('Haber yenileme işlemi tamamlandı.')}).catch(function(){announce('Haberler yenilenemedi. Bağlantıyı kontrol edin.')})}catch(e){announce('Haberler yenilenemedi.')}
      }else announce('Haber yenileme aracı kullanılamıyor.');
    }
  }
  D.addEventListener('change',function(e){var n=e.target;if(!n.matches||!n.matches('#view .lexFuncAccordion [data-lexfunc]'))return;
    var k=n.dataset.lexfunc,v=n.value;
    if(Object.prototype.hasOwnProperty.call(allowed,k)){
      if(allowed[k].indexOf(v)<0)return;pref[k]=v;saveOwn();announce('Tercih kaydedildi.');return;
    }
    if(k==='newsMin'){
      if(!['default','5','10','15','30','60','120'].includes(v))return;
      if(v==='default')safeRemove(PREFIX+'newsMin');else safeSet(PREFIX+'newsMin',v);
      announce('Haber yenileme tercihi kaydedildi.');return;
    }
    if(k.indexOf('feed-')===0){
      var target=k.substring(5),feeds=newsFeeds();
      if(!Object.prototype.hasOwnProperty.call(feeds,target))return;
      feeds[target]=v==='on';
      if(!feeds.tr&&!feeds.nl&&!feeds.world){n.value='on';announce('En az bir haber kaynağı açık kalmalıdır.');return}
      safeSet(PREFIX+'newsFeedConfig',JSON.stringify(feeds));announce('Haber kaynakları kaydedildi.');
    }
  });
  D.addEventListener('click',function(e){
    var el=e.target&&e.target.closest?e.target.closest('[data-lexfunc-action]'):null;
    if(el&&el.closest('.lexFuncAccordion')){e.preventDefault();trigger(el.dataset.lexfuncAction);return}
    if(pref.haptics==='on'&&e.isTrusted&&e.target&&e.target.closest&&e.target.closest('button,.tabBtn')){
      try{if(typeof navigator.vibrate==='function')navigator.vibrate(12)}catch(_){}
    }
  },false);
  function wrapSpeech(){
    try{
      var synth=W.speechSynthesis;if(!synth||typeof synth.speak!=='function'||synth.__lexFuncWrappedSpeak)return;
      var old=synth.speak.bind(synth);
      synth.speak=function(utterance){
        if(utterance){
          try{var r=Number(pref.speechRate),p=Number(pref.speechPitch);
            if(r!==1)utterance.rate=Math.max(.1,Math.min(10,Number(utterance.rate||1)*r));
            if(p!==1)utterance.pitch=Math.max(0,Math.min(2,Number(utterance.pitch==null?1:utterance.pitch)*p));
          }catch(_){}
        }
        return old(utterance);
      };
      synth.__lexFuncWrappedSpeak=true;
    }catch(e){}
  }
  function boot(){
    var view=D.getElementById('view');if(!view)return;
    new MutationObserver(schedule).observe(view,{subtree:true,childList:true});
    wrapSpeech();schedule();
  }
  if(D.readyState==='loading')D.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
  W.lexGoldFunctionalSettings={get:function(){return Object.assign({},pref)},refresh:enhance};
})();

</script>
